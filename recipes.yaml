items:
  hamburger:
    scene: res://items/hamburger.tscn
  burger_buns:
    scene: res://items/BurgerBuns.tscn
  raw_burger:
    scene: res://items/burger.tscn
  cooked_burger:
    scene: res://items/cooked_burger.tscn
  cube:
    scene: res://items/PickupCube.tscn
  charcoal:
    scene: res://items/Charcoal.tscn
  potato:
    scene: res://items/potato.tscn
  chopped_potato:
    scene: res://items/chopped_potato.tscn
  chips:
    scene: res://items/chips.tscn

combining:
  hamburger:
    - [cooked_burger, burger_buns]
    - [charcoal, charcoal]

cooking:
  cooked_burger:
    ingredient: raw_burger
    time: 4
  charcoal:
    - ingredient: cooked_burger
      time: 5
    - ingredient: toast
      time: 2
    - ingredient: cube
      time: 1
  chips:
    ingredient: chopped_potato
    time: 3

chopping:
  salad: 
    ingredient: lettuce
    work: 50
  chopped_potato:
    ingredient: potato
    work: 30

rolling:
  pie_base:
    ingredient: dough
    work: 80

augmenting:
  cooked_burger:
    has_tomato: sliced_tomato
    has_cheese: cheese
  salad:
    has_tomato: sliced_tomato
    has_olives: olives
